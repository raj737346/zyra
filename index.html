<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Zyra — AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --text:#111111;
  --muted:#888888;
  --accent:#1f57ff;
  --accent-bg:#eef2ff;
  --panel:#f9f9f9;
  --border:#e5e5e5;
  --user-bg:#f3f4f6;
  --shadow:0 4px 20px rgba(0,0,0,0.05);
}
[data-theme="dark"]{
  --bg:#111111;
  --text:#eeeeee;
  --muted:#888888;
  --accent:#3b75ff;
  --accent-bg:#1a2235;
  --panel:#1e1e1e;
  --border:#333333;
  --user-bg:#2a2a2a;
  --shadow:0 4px 20px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans Tamil",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative}

/* Header */
header{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.header-left{display:flex;align-items:center;gap:12px}
.iconbtn{color:var(--text);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;transition:background 0.2s}
.iconbtn:hover{background:var(--panel)}
.header-right{display:flex;align-items:center;gap:10px}

/* Main Content */
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:20px;scroll-behavior:smooth}
.center-logo{width:50px;height:50px;color:var(--accent);margin-top:25vh;margin-bottom:16px}
.center-title{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-0.5px;margin-bottom:40px}

/* Chat Messages */
.chat-container{width:100%;max-width:700px;display:flex;flex-direction:column;gap:24px;padding-bottom:20px}
.message{display:flex;gap:12px;align-items:flex-start;width:100%}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}
.bubble{max-width:85%;line-height:1.6;font-size:15px;overflow-wrap:anywhere}
.message.user .bubble{background:var(--user-bg);padding:12px 18px;border-radius:20px 20px 4px 20px}
.message.ai .bubble{background:transparent;padding:0;max-width:100%}
.bubble img{max-width:min(250px,100%);border-radius:12px;display:block;margin-bottom:8px}
.msg-tools{display:flex;gap:12px;margin-top:12px}
.tool-btn{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px}
.tool-btn:hover{color:var(--accent)}

/* Markdown */
.bubble pre{white-space:pre-wrap;overflow-x:auto;background:var(--panel);padding:14px;border-radius:12px;margin:10px 0;border:1px solid var(--border)}
.bubble code{background:var(--panel);padding:2px 6px;border-radius:6px;font-size:13px;border:1px solid var(--border)}
.bubble pre code{background:none;padding:0;border:none}
.bubble a{color:var(--accent);text-decoration:none}
.bubble p{margin-bottom:12px}
.bubble p:last-child{margin-bottom:0}

/* Composer Area */
.composer-wrap{width:100%;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(transparent, var(--bg) 20%)}
.composer{width:100%;max-width:700px;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:10px 14px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 15px rgba(0,0,0,0.03)}
.composer:focus-within{border-color:#d0d0d0}
[data-theme="dark"] .composer:focus-within{border-color:#444}
.composer input{flex:1;border:none;background:transparent;font-size:16px;outline:none;padding:8px 0}
.composer input::placeholder{color:var(--muted)}
.composer-actions{display:flex;align-items:center;gap:8px}

/* Toggles */
.toggle-btns{display:flex;gap:6px;margin-bottom:8px;width:100%;max-width:700px}
.tbtn{border:1px solid transparent;background:var(--panel);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500}
.tbtn.active{background:var(--accent-bg);color:var(--accent);border-color:#d0dfff}

/* Buttons inside composer */
.icon-send{background:var(--accent);color:white;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:opacity 0.2s}
.icon-send:disabled{opacity:0.5}
.icon-circle{color:var(--text);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border)}
.icon-circle:hover{background:var(--panel)}

/* Typing indicator */
.typing{display:flex;gap:4px;align-items:center;height:24px}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.typing span:nth-child(1){animation-delay:-0.32s}
.typing span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Drawer (Menu) */
.overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:10;backdrop-filter:blur(2px)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:280px;background:var(--bg);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform 0.3s ease}
.overlay.show .drawer{transform:translateX(0)}
.overlay.show{display:block}
.history-list{margin-top:20px;flex:1;overflow-y:auto}
.history-item{padding:12px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center}
.history-item:hover{background:var(--panel)}
.del-btn{color:var(--muted);font-size:16px;padding:4px}
.del-btn:hover{color:red}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <button class="iconbtn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="header-right">
      <button class="iconbtn" id="newBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main id="chatArea">
    <div id="welcomeScreen" style="text-align:center; display:flex; flex-direction:column; align-items:center;">
      <svg class="center-logo" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <h1 class="center-title">Where would you like to begin?</h1>
    </div>
    <div class="chat-container" id="chat"></div>
  </main>

  <div class="composer-wrap">
    <div class="toggle-btns">
      <button class="tbtn" id="thinkBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
        Think
      </button>
      <button class="tbtn" id="searchBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Search
      </button>
    </div>
    <div class="composer">
      <input type="text" id="prompt" placeholder="Type a message or hold to speak" autocomplete="off">
      <div class="composer-actions">
        <button class="icon-circle" id="voiceBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
        </button>
        <button class="icon-send" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="drawerOverlay">
    <aside class="drawer">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <strong style="font-size:18px;">Zyra History</strong>
        <button class="iconbtn" id="closeDrawer">✕</button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button id="clearAll" style="margin-top:auto; color:var(--muted); font-size:13px; text-align:left; padding:10px;">Clear all</button>
    </aside>
  </div>
</div>

<script>
(() => {
'use strict';
// ⚠️ முக்கியம்: உங்கள் Backend ஃபைலின் பெயர் 'summarize.js' என்பதால் URL இப்படி மாற்றப்பட்டுள்ளது
const API_URL = '/api/summarize'; 
const $ = id => document.getElementById(id);
const chat = $('chat'), promptBox = $('prompt'), sendBtn = $('sendBtn');
const welcomeScreen = $('welcomeScreen');

let think = false, searching = false, busy = false, recognition = null;
let currentMessages = [];
let currentChatId = null;
let history = [];
let abortController = null;

try { history = JSON.parse(localStorage.getItem('zyra_history') || '[]'); if(!Array.isArray(history)) history=[]; } catch { history=[]; }

// UI Toggles
$('thinkBtn').onclick = () => { think = !think; $('thinkBtn').classList.toggle('active', think); };
$('searchBtn').onclick = () => { searching = !searching; $('searchBtn').classList.toggle('active', searching); };

// History Functions
function saveHistory(){
  if(!currentMessages.length) return;
  if(currentChatId === null) currentChatId = Date.now();
  const u = currentMessages.find(m => m.role === 'user');
  const title = u ? Array.from(u.text).slice(0, 40).join('') : 'New Chat';
  
  const idx = history.findIndex(h => h.id === currentChatId);
  const item = { id: currentChatId, title: title, messages: currentMessages.slice(), updated: Date.now() };
  if(idx >= 0) history[idx] = item;
  else history.unshift(item);
  history = history.slice(0, 20);
  try{ localStorage.setItem('zyra_history', JSON.stringify(history)); }catch{}
  renderHistory();
}

function renderHistory(){
  const list = $('historyList'); list.innerHTML = '';
  history.forEach(item => {
    const row = document.createElement('div'); row.className = 'history-item';
    row.innerHTML = `<span>${item.title}</span>`;
    row.onclick = () => loadChat(item.id);
    const del = document.createElement('button'); del.className = 'del-btn'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteChat(item.id); };
    row.appendChild(del); list.appendChild(row);
  });
}

function deleteChat(id){
  history = history.filter(h => h.id !== id);
  try{ localStorage.setItem('zyra_history', JSON.stringify(history)); }catch{}
  if(currentChatId === id){ currentMessages = []; currentChatId = null; chat.innerHTML=''; welcomeScreen.style.display='flex'; }
  renderHistory();
}

$('clearAll').onclick = () => { 
  history = []; currentMessages = []; currentChatId = null; 
  try{ localStorage.removeItem('zyra_history'); }catch{} 
  renderHistory(); chat.innerHTML = ''; welcomeScreen.style.display = 'flex'; 
};

function loadChat(id){
  const item = history.find(h => h.id === id); if(!item) return;
  currentMessages = (item.messages || []).slice(); currentChatId = id;
  chat.innerHTML = ''; welcomeScreen.style.display = 'none';
  currentMessages.forEach(m => addMessage(m.role, m.text, m.image, false));
  $('drawerOverlay').classList.remove('show');
}

// Markdown (Simple)
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMarkdown(text){
  let s = escapeHtml(text || '');
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>'+c+'</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

// Add Message to UI
function addMessage(role, text, image = null, store = true){
  welcomeScreen.style.display = 'none';
  const row = document.createElement('div'); row.className = 'message ' + role;
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  
  if(image){ const img = document.createElement('img'); img.src = image; bubble.appendChild(img); }
  
  const content = document.createElement('div');
  content.innerHTML = role === 'ai' ? renderMarkdown(text) : escapeHtml(text || '');
  bubble.appendChild(content);

  if(role === 'ai'){
    const tools = document.createElement('div'); tools.className = 'msg-tools';
    const copy = document.createElement('button'); copy.className = 'tool-btn'; copy.textContent = 'Copy';
    copy.onclick = () => { navigator.clipboard?.writeText(text || ''); copy.textContent = 'Copied!'; setTimeout(()=>copy.textContent='Copy', 1500); };
    tools.appendChild(copy); bubble.appendChild(tools);
  }

  row.appendChild(bubble); chat.appendChild(row);
  const main = $('chatArea'); main.scrollTop = main.scrollHeight;
  if(store) currentMessages.push({ role, text, image });
}

// Send Message
async function send(){
  if(busy){ abortController?.abort(); return; }
  const text = promptBox.value.trim();
  if(!text) return;

  addMessage('user', text);
  promptBox.value = '';
  busy = true; sendBtn.disabled = true;
  sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>';

  // ⚠️ உங்கள் Backend 'isSearching' என்று எதிர்பார்ப்பதால் அதை மாற்றியுள்ளேன்
  const payload = {
    notes: text,
    think: think,
    isSearching: searching,
    history: currentMessages.slice(-10)
  };

  // AI Typing Indicator
  const aiRow = document.createElement('div'); aiRow.className = 'message ai'; aiRow.id = 'streamMsg';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const content = document.createElement('div'); content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  bubble.appendChild(content); aiRow.appendChild(bubble); chat.appendChild(aiRow);
  const main = $('chatArea'); main.scrollTop = main.scrollHeight;

  let full = '';
  abortController = new AbortController();

  try{
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: abortController.signal
    });
    if(!res.ok) throw new Error(`Server error (${res.status})`);

    const data = await res.json();
    
    // உங்கள் Backend 'answer' அல்லது 'summary' என்று அனுப்பலாம்
    full = data.answer || data.summary || data.response || data.text || 'பதில் கிடைக்கவில்லை.';
    
    // Typewriter effect
    let i = 0;
    content.innerHTML = '';
    function typeWriter() {
        if (i < full.length) {
            content.innerHTML = renderMarkdown(full.substring(0, i + 1));
            main.scrollTop = main.scrollHeight;
            i += 2; 
            setTimeout(typeWriter, 10);
        } else {
            content.innerHTML = renderMarkdown(full);
            const tools = document.createElement('div'); tools.className = 'msg-tools';
            const copy = document.createElement('button'); copy.className='tool-btn'; copy.textContent='Copy';
            copy.onclick = () => { navigator.clipboard?.writeText(full); copy.textContent='Copied!'; setTimeout(()=>copy.textContent='Copy', 1500); };
            tools.appendChild(copy); bubble.appendChild(tools);
            
            currentMessages.push({ role: 'ai', text: full });
            saveHistory();
            busy = false; sendBtn.disabled = false;
            sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
        }
    }
    typeWriter();

  }catch(err){
    aiRow.remove();
    busy = false; sendBtn.disabled = false;
    sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    if(err.name !== 'AbortError'){
      addMessage('ai', 'Error: ' + (err.message || 'Connection failed'));
    }
  }
}

sendBtn.onclick = send;
promptBox.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); send(); } });

// New Chat
$('newBtn').onclick = () => {
  if(currentMessages.length) saveHistory();
  currentMessages = []; currentChatId = null;
  chat.innerHTML = ''; welcomeScreen.style.display = 'flex'; promptBox.focus();
};

// Drawer
$('menuBtn').onclick = () => $('drawerOverlay').classList.add('show');
$('closeDrawer').onclick = () => $('drawerOverlay').classList.remove('show');
$('drawerOverlay').onclick = (e) => { if(e.target === $('drawerOverlay')) $('drawerOverlay').classList.remove('show'); };

// Voice Input
$('voiceBtn').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice not supported'); return; }
  if(recognition){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'ta-IN'; // தமிழ் குரலுக்கு
  recognition.interimResults = false;
  recognition.onresult = e => { promptBox.value += e.results[0][0].transcript; };
  recognition.onend = () => recognition = null;
  recognition.start();
  $('voiceBtn').style.color = 'red';
  recognition.onend = () => { recognition = null; $('voiceBtn').style.color = 'var(--text)'; };
};

renderHistory();
})();
</script>
</body>
</html>
