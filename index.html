<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Zyra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --text: #000000;
  --text-light: #888888;
  --surface: #F4F4F4;
  --accent: #FF6B2C;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  height: 100vh; height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 16px;
  overflow: hidden;
}
.center-view {
  height: 100%; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
  transition: opacity 0.3s;
}
.center-view h1 {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 44px; font-weight: 400; margin: 0 0 8px 0;
  letter-spacing: -0.02em;
}
.center-view p {
  color: var(--text-light); font-size: 15px; margin: 0;
}
html[lang="ta"] .center-view h1 { font-family: 'Noto Serif Tamil', serif; font-size: 38px; }
.chat-area {
  display: none;
  height: 100%; width: 100%;
  overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top)) 16px 100px 16px;
  flex-direction: column;
}
.chat-area.active { display: flex; }
.msg-user {
  align-self: flex-end;
  background: var(--surface);
  padding: 12px 18px;
  border-radius: 20px;
  max-width: 85%;
  margin-bottom: 24px;
  white-space: pre-wrap;
  font-size: 16px;
}
.msg-ai {
  align-self: flex-start;
  width: 100%;
  margin-bottom: 30px;
  line-height: 1.6;
  font-size: 16px;
}
.msg-ai h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--accent); margin: 20px 0 6px;
}
.msg-ai h3:first-child { margin-top: 0; }
.msg-ai p { margin: 0 0 12px; }
.msg-ai ul, .msg-ai ol { margin: 0 0 12px; padding-left: 20px; }
.msg-ai li { margin-bottom: 6px; }
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  background: #FFFFFF;
  display: flex; flex-direction: column; gap: 10px;
}
.modes {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.modes::-webkit-scrollbar { display: none; }
.mode-btn {
  border: none; background: transparent;
  padding: 6px 12px; border-radius: 16px;
  font-size: 13px; color: var(--text-light); cursor: pointer;
  white-space: nowrap;
}
.mode-btn.active {
  background: var(--surface); color: var(--text); font-weight: 500;
}
.input-pill {
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--surface);
  border-radius: 26px;
  padding: 8px 8px 8px 18px;
}
textarea {
  flex: 1; border: none; background: transparent;
  padding: 10px 0; font-size: 16px; resize: none;
  max-height: 120px; outline: none; font-family: inherit; line-height: 1.4;
  color: var(--text);
}
textarea::placeholder { color: var(--text-light); }
.send-btn {
  background: var(--text); color: #FFF;
  border: none; width: 36px; height: 36px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: opacity 0.2s;
}
.send-btn:disabled { opacity: 0.2; }
.send-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.loader { display: flex; gap: 4px; align-items: center; color: var(--text-light); font-size: 14px; padding: 10px 0; }
.dot { width: 5px; height: 5px; background: var(--text-light); border-radius: 50%; animation: pulse 1s infinite alternate; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { to { opacity: 0.2; transform: translateY(-3px); } }
</style>
</head>
<body>
<div class="center-view" id="centerView">
  <h1 id="tagline">மனதில் ஒரு பொறி.</h1>
  <p id="intro">உங்கள் எண்ணங்களைத் தெளிவாக்குங்கள்.</p>
</div>
<div class="chat-area" id="chatArea"></div>
<div class="bottom-bar">
  <div class="modes">
    <button class="mode-btn active" data-mode="weekly" onclick="setMode('weekly')">வாரச் சுருக்கம்</button>
    <button class="mode-btn" data-mode="daily" onclick="setMode('daily')">தினசரி</button>
    <button class="mode-btn" data-mode="ask" onclick="setMode('ask')">கேள்</button>
  </div>
  <div class="input-pill">
    <textarea id="notes" rows="1" placeholder="Message Zyra..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
    <button class="send-btn" id="sendBtn" onclick="spark()">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let lang = 'ta', mode = 'weekly';
const I18N = {
  ta: { tagline: 'மனதில் ஒரு பொறி.', intro: 'உங்கள் எண்ணங்களைத் தெளிவாக்குங்கள்.', placeholder: 'உங்கள் குறிப்புகளை இங்கே எழுதுங்கள்...', summary: 'சுருக்கம்', themes: 'கருப்பொருள்கள்', overdue: 'தொடர வேண்டியவை', priorities: 'முன்னுரிமைகள்', checklist: 'செயல் பட்டியல்', answer: 'பதில்', error: 'பிழை: தயவுசெய்து Vercel லிங்க் மூலம் திறக்கவும் அல்லது API Key-ஐ சரிபார்க்கவும்.' },
  en: { tagline: 'Spark your mind.', intro: 'Make sense of your thoughts.', placeholder: 'Message Zyra...', summary: 'Summary', themes: 'Themes', overdue: 'Open loops', priorities: 'Priorities', checklist: 'Checklist', answer: 'Answer', error: 'Error: Please open via Vercel link or check API Key.' },
  hi: { tagline: 'मन में एक चिंगारी।', intro: 'अपने विचारों को स्पष्ट करें।', placeholder: 'Zyra को संदेश भेजें...', summary: 'सारांश', themes: 'विषय', overdue: 'बाक़ी काम', priorities: 'प्राथमिकताएँ', checklist: 'सूची', answer: 'जवाब', error: 'त्रुटि: कृपया Vercel लिंक से खोलें या API Key जाँचें।' }
};
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
}
function esc(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
async function spark() {
  const notes = $('notes').value.trim();
  if (!notes) return;
  $('centerView').style.display = 'none';
  $('chatArea').classList.add('active');
  const chat = $('chatArea');
  const sendBtn = $('sendBtn');
  sendBtn.disabled = true;
  $('notes').value = ''; $('notes').style.height = '';
  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  userMsg.textContent = notes;
  chat.appendChild(userMsg);
  window.scrollTo(0, document.body.scrollHeight);
  const loaderMsg = document.createElement('div');
  loaderMsg.className = 'msg-ai';
  loaderMsg.innerHTML = '<div class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  chat.appendChild(loaderMsg);
  window.scrollTo(0, document.body.scrollHeight);
  try {
    const res = await fetch('/api/summarize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes, mode, lang })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'ERROR');
    chat.removeChild(loaderMsg);
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg-ai';
    let html = '';
    if (mode === 'ask') {
      html = `<h3>${I18N[lang].answer}</h3><p>${esc(data.answer || '')}</p>`;
    } else {
      html += `<h3>${I18N[lang].summary}</h3><p>${esc(data.summary || '')}</p>`;
      if(data.themes?.length) html += `<h3>${I18N[lang].themes}</h3><ul>${data.themes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
      if(data.overdue?.length) html += `<h3>${I18N[lang].overdue}</h3><ul>${data.overdue.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
      if(data.priorities?.length) html += `<h3>${I18N[lang].priorities}</h3><ol>${data.priorities.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`;
      if(data.checklist?.length) html += `<h3>${I18N[lang].checklist}</h3><ul>${data.checklist.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
    }
    aiMsg.innerHTML = html;
    chat.appendChild(aiMsg);
  } catch (e) {
    chat.removeChild(loaderMsg);
    const errMsg = document.createElement('div');
    errMsg.className = 'msg-ai';
    errMsg.innerHTML = errMsg.innerHTML = `<p style="color:#FF6B2C; font-weight:500; padding:12px; background:#FFF0E5; border-radius:12px;">${e.message || I18N[lang].error}</p>`;
    chat.appendChild(errMsg);
  } finally {
    sendBtn.disabled = false;
    window.scrollTo(0, document.body.scrollHeight);
  }
}
</script>
</body>
</html>
