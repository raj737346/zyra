<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Zyra — Spark your mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --text:#191918; --muted:#777671;
  --accent:#f36b38; --accent2:#fff0e9; --panel:#f7f7f6;
  --border:#e8e7e4; --user:#f4f1ed; --shadow:0 12px 40px rgba(0,0,0,0.07);
}
[data-theme="dark"]{
  --bg:#101010; --text:#f4f2ee; --muted:#aaa7a0;
  --accent:#ff7846; --accent2:#38231b; --panel:#191919;
  --border:#30302e; --user:#242321; --shadow:0 12px 40px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;position:relative}

/* Header */
header{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--bg)}
.header-left{display:flex;align-items:center;gap:10px}
.iconbtn{color:var(--text);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;transition:background 0.2s}
.iconbtn:hover{background:var(--panel)}
.header-right{display:flex;align-items:center;gap:8px}

/* Main Content */
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:20px;scroll-behavior:smooth}

/* Welcome Screen */
.welcome{max-width:650px;margin:20vh auto 25px;text-align:center; display:flex; flex-direction:column; align-items:center;}
.welcome .spark{font-size:40px;color:var(--accent); margin-bottom:16px;}
.welcome h1{font-size:clamp(32px,6vw,48px);letter-spacing:-1.8px;margin:0 0 5px; font-weight:700;}
.welcome h1 em{font-family:"Instrument Serif",serif;font-weight:400;color:var(--accent); font-style: italic;}
.welcome h2{font-size:38px; color:var(--text); font-weight:700; margin-top:10px;}

/* Chat Messages */
.chat-container{width:100%;max-width:760px;display:flex;flex-direction:column;gap:20px;padding-bottom:20px; margin-top:20px;}
.message{display:flex;gap:10px;align-items:flex-start;width:100%}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}
.avatar{flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-size:14px}
.message.user .avatar{order:2;background:var(--panel);color:var(--muted)}
.bubble{min-width:0;max-width:calc(100% - 40px);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.message.user .bubble{background:var(--user);padding:12px 16px;border-radius:16px 4px 16px 16px}
.message.ai .bubble{padding:2px 0}
.bubble img{max-width:100%;border-radius:12px;display:block;margin-bottom:8px;box-shadow:var(--shadow)}

/* Message Tools */
.msg-tools{display:flex;gap:12px;margin-top:12px;align-items:center;flex-wrap:wrap}
.tool-btn{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;transition:all 0.2s;}
.tool-btn:hover{color:var(--text)}
.speak-btn.active { color: var(--accent); font-weight: bold;}

/* Markdown */
.bubble pre{white-space:pre-wrap;overflow-x:auto;background:var(--panel);padding:12px;border-radius:10px;margin:10px 0}
.bubble code{background:var(--panel);padding:2px 6px;border-radius:6px;font-size:13px}
.bubble a{color:var(--accent);text-decoration:none}
.bubble p{margin-bottom:12px}
.bubble p:last-child{margin-bottom:0}

/* Composer Area */
.composer-wrap{width:100%;padding:10px 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(transparent, var(--bg) 20%)}
.composer{
  width:100%; max-width:760px; background:var(--bg); border:1px solid var(--border); 
  border-radius:24px; padding:10px 14px 10px 18px; display:flex; 
  flex-direction:column; gap:10px; box-shadow:0 2px 15px rgba(0,0,0,0.03); transition:border-color 0.2s;
}
.composer:focus-within{border-color:#d0d0d0}
[data-theme="dark"] .composer:focus-within{border-color:#444}

.composer-input-row{display:flex; align-items:flex-start; width:100%; gap:10px;}
.composer textarea {
  flex:1; border:none; background:transparent; font-size:16px; outline:none; 
  padding:8px 0; min-width:120px; resize:none; overflow-y:hidden; 
  line-height:1.5; max-height:200px; color:var(--text); font-family:inherit;
}
.composer textarea::placeholder{color:var(--muted)}

.composer-bottom-row{display:flex; justify-content:space-between; align-items:center; width:100%;}
.toggle-btns{display:flex; gap:6px; align-items:center;}
.tbtn{border:1px solid transparent;background:var(--panel);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500; transition:all 0.2s;}
.tbtn.active{background:var(--accent2);color:var(--accent);border-color:#f36b3833}

.composer-actions{display:flex;align-items:center;gap:8px}
.preview-img{width:40px;height:40px;border-radius:8px;object-fit:cover;display:none;margin-right:5px}

/* Buttons */
.icon-send{background:var(--accent);color:white;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:all 0.2s}
.icon-send:disabled{opacity:0.6;cursor:not-allowed}
.icon-send.stop-state{background:var(--text);color:var(--bg)}
.icon-circle{color:var(--text);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:var(--bg)}
.icon-circle:hover{background:var(--panel)}

/* Typing indicator */
.typing{display:flex;gap:4px;align-items:center;height:24px}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.typing span:nth-child(1){animation-delay:-0.32s}
.typing span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Drawer */
.overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:10;backdrop-filter:blur(2px)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:280px;background:var(--bg);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform 0.3s ease}
.overlay.show .drawer{transform:translateX(0)}
.overlay.show{display:block}
.history-list{margin-top:20px;flex:1;overflow-y:auto}
.history-item{padding:12px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center}
.history-item:hover{background:var(--panel)}
.del-btn{color:var(--muted);font-size:16px;padding:4px}
.del-btn:hover{color:red}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <button class="iconbtn" id="menuBtn" title="History">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="header-right">
      <button class="iconbtn" id="exportBtn" title="Export Chat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" title="Toggle Theme">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="iconbtn" id="newBtn" title="New Chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main id="chatArea">
    <div id="welcomeScreen" class="welcome">
      <div class="spark">✳</div>
      <h1>Spark your <em>mind.</em></h1>
      <h2>Zyra</h2>
    </div>
    
    <div class="chat-container" id="chat"></div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      
      <div class="composer-input-row">
        <img id="imgPreview" class="preview-img" src="" alt="preview">
        <textarea id="prompt" rows="1" placeholder="Type a message or hold to speak..."></textarea>
      </div>

      <div class="composer-bottom-row">
        <div class="toggle-btns">
          <button class="tbtn" id="thinkBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
            Think
          </button>
          <button class="tbtn" id="searchBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            Search
          </button>
        </div>

        <div class="composer-actions">
          <input type="file" id="fileInput" accept="image/*" hidden>
          <button class="icon-circle" id="attachBtn" title="Attach Image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-send" id="sendBtn" title="Send">
            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="overlay" id="drawerOverlay">
    <aside class="drawer">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <strong style="font-size:18px;">Zyra History</strong>
        <button class="iconbtn" id="closeDrawer">✕</button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button id="clearAll" style="margin-top:auto; color:var(--muted); font-size:13px; text-align:left; padding:10px;">Clear all</button>
    </aside>
  </div>
</div>

<script>
(() => {
'use strict';
const API_URL = '/api/summarize'; 
const $ = id => document.getElementById(id);
const chat = $('chat'), promptBox = $('prompt'), sendBtn = $('sendBtn'), sendIcon = $('sendIcon');
const welcomeScreen = $('welcomeScreen');

let think = false, searching = false, busy = false, recognition = null;
let selectedImage = null; 
let currentMessages = [];
let currentChatId = null;
let history = [];
let abortController = null;

// 🧠 இங்கே தான் நினைவாற்றல் (Memory Power) வேலை செய்கிறது
let currentLanguage = 'en'; 

try { history = JSON.parse(localStorage.getItem('zyra_history') || '[]'); if(!Array.isArray(history)) history=[]; } catch { history=[]; }
try { const savedTheme = localStorage.getItem('zyra_theme'); if(savedTheme) document.documentElement.dataset.theme = savedTheme; } catch {}

$('thinkBtn').onclick = () => { think = !think; $('thinkBtn').classList.toggle('active', think); };
$('searchBtn').onclick = () => { searching = !searching; $('searchBtn').classList.toggle('active', searching); };

$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme !== 'dark';
  root.dataset.theme = dark ? 'dark' : 'light';
  try{ localStorage.setItem('zyra_theme', root.dataset.theme); }catch{}
};

$('attachBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    selectedImage = ev.target.result;
    $('imgPreview').src = selectedImage;
    $('imgPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
};

$('exportBtn').onclick = () => {
    if(currentMessages.length === 0) { alert('No chat to export'); return; }
    let text = "Zyra Chat Export\n\n";
    currentMessages.forEach(m => {
        text += `[${m.role.toUpperCase()}]\n${m.text}\n\n`;
    });
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Zyra_Chat_${new Date().getTime()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
};

function saveHistory(){
  if(!currentMessages.length) return;
  if(currentChatId === null) currentChatId = Date.now();
  const u = currentMessages.find(m => m.role === 'user');
  const title = u ? Array.from(u.text || 'Image').slice(0, 40).join('') : 'New Chat';
  
  const idx = history.findIndex(h => h.id === currentChatId);
  const item = { id: currentChatId, title: title, messages: currentMessages.slice(), updated: Date.now() };
  if(idx >= 0) history[idx] = item;
  else history.unshift(item);
  history = history.slice(0, 20);
  try{ localStorage.setItem('zyra_history', JSON.stringify(history)); }catch{}
  renderHistory();
}

function renderHistory(){
  const list = $('historyList'); list.innerHTML = '';
  history.forEach(item => {
    const row = document.createElement('div'); row.className = 'history-item';
    row.innerHTML = `<span>${item.title}</span>`;
    row.onclick = () => loadChat(item.id);
    const del = document.createElement('button'); del.className = 'del-btn'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); deleteChat(item.id); };
    row.appendChild(del); list.appendChild(row);
  });
}

function deleteChat(id){
  history = history.filter(h => h.id !== id);
  try{ localStorage.setItem('zyra_history', JSON.stringify(history)); }catch{}
  if(currentChatId === id){ currentMessages = []; currentChatId = null; chat.innerHTML=''; welcomeScreen.style.display='flex'; }
  renderHistory();
}

$('clearAll').onclick = () => { 
  history = []; currentMessages = []; currentChatId = null; 
  try{ localStorage.removeItem('zyra_history'); }catch{} 
  renderHistory(); chat.innerHTML = ''; welcomeScreen.style.display = 'flex'; 
};

function loadChat(id){
  const item = history.find(h => h.id === id); if(!item) return;
  currentMessages = (item.messages || []).slice(); currentChatId = id;
  chat.innerHTML = ''; welcomeScreen.style.display = 'none';
  
  currentLanguage = 'en';
  for (let m of currentMessages) {
      if (m.text && /[\u0B80-\u0BFF]/.test(m.text)) { currentLanguage = 'ta'; break; }
  }

  currentMessages.forEach(m => addMessage(m.role, m.text, m.image, false));
  $('drawerOverlay').classList.remove('show');
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMarkdown(text){
  let s = escapeHtml(text || '');
  s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1">');
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>'+c+'</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

const speakerSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;

function createSpeakBtn(text) {
  const btn = document.createElement('button');
  btn.className = 'tool-btn speak-btn';
  btn.innerHTML = speakerSVG + ' <span>Listen</span>';
  
  btn.onclick = () => {
     if('speechSynthesis' in window){
         if (btn.classList.contains('active')) {
             speechSynthesis.cancel();
             btn.classList.remove('active');
             btn.querySelector('span').textContent = 'Listen';
         } else {
             speechSynthesis.cancel();
             const u = new SpeechSynthesisUtterance(text);
             if (/[\u0B80-\u0BFF]/.test(text)) u.lang = 'ta-IN';
             else if (/[\u0900-\u097F]/.test(text)) u.lang = 'hi-IN';
             else u.lang = 'en-US'; 
             speechSynthesis.speak(u);
             btn.classList.add('active');
             btn.querySelector('span').textContent = 'Stop';
             u.onend = () => {
                 btn.classList.remove('active');
                 btn.querySelector('span').textContent = 'Listen';
             };
         }
     }
  };
  return btn;
}

function addMessage(role, text, image = null, store = true){
  welcomeScreen.style.display = 'none';
  const row = document.createElement('div'); row.className = 'message ' + (role === 'user' ? 'user' : 'ai');
  const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? '●' : '✳';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  
  if(image){ const img = document.createElement('img'); img.src = image; bubble.appendChild(img); }
  
  const content = document.createElement('div');
  content.innerHTML = role === 'ai' ? renderMarkdown(text) : escapeHtml(text || '');
  bubble.appendChild(content);

  if(role === 'ai'){
    const tools = document.createElement('div'); tools.className = 'msg-tools';
    const copy = document.createElement('button'); copy.className = 'tool-btn'; 
    copy.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>Copy</span>';
    copy.onclick = () => { 
        navigator.clipboard?.writeText(text || ''); 
        const span = copy.querySelector('span');
        span.textContent = 'Copied!'; 
        copy.style.color = 'green'; 
        setTimeout(()=>{ span.textContent = 'Copy'; copy.style.color = 'var(--muted)'; }, 1500); 
    };
    const speak = createSpeakBtn(text);
    tools.appendChild(copy); tools.appendChild(speak); bubble.appendChild(tools);
  }

  row.append(avatar, bubble); chat.appendChild(row);
  const main = $('chatArea'); main.scrollTop = main.scrollHeight;
  if(store) currentMessages.push({ role, text, image });
}

async function send(){
  if(busy){ abortController?.abort(); return; }
  const text = promptBox.value.trim();
  if(!text && !selectedImage) return;

  const imgData = selectedImage;
  addMessage('user', text, imgData);
  
  promptBox.value = '';
  promptBox.style.height = 'auto';
  selectedImage = null;
  $('imgPreview').style.display = 'none';
  $('fileInput').value = '';

  busy = true; 
  sendBtn.classList.add('stop-state');
  sendIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" fill="currentColor"/>'; 

  const lowerText = text.toLowerCase();
  
  if ((lowerText.includes('news') || lowerText.includes('headlines')) && searching) {
      const searchQuery = text.replace(/news|headlines|give me|the latest|about/gi, '').trim() || 'Global';
      const googleNewsUrl = `https://news.google.com/search?q=${encodeURIComponent(searchQuery)}&hl=en-IN&gl=IN&ceid=IN:en`;

      const aiRow = document.createElement('div'); aiRow.className = 'message ai';
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = '✳';
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      bubble.innerHTML = `<p>Here are the latest headlines for "${searchQuery}":</p>
      <p><a href="${googleNewsUrl}" target="_blank" style="font-weight:bold; font-size:16px; display:inline-block; padding:10px 15px; background:var(--accent2); color:var(--accent); border-radius:8px;">👉 Click here to read the latest news</a></p>
      <p style="font-size: 13px; color: var(--muted); margin-top: 10px;">(Direct link provided because your Gemini API doesn't have Search Grounding enabled).</p>`;
      
      aiRow.append(avatar, bubble); chat.appendChild(aiRow);
      currentMessages.push({ role: 'ai', text: `Provided direct Google News link for: ${searchQuery}` });
      saveHistory();
      
      busy = false; 
      sendBtn.classList.remove('stop-state');
      sendIcon.innerHTML = '<path d="M12 19V5M5 12l7-7 7 7"/>'; 
      return;
  }

  // 🧠 மொழியை நினைவில் வைத்துக்கொள்ளும் லாஜிக் (Memory Logic)
  if (lowerText.includes('tamil') || /[\u0B80-\u0BFF]/.test(text)) {
      currentLanguage = 'ta'; // தமிழ் மொழிக்கு மாற்று
  } else if (lowerText.includes('english')) {
      currentLanguage = 'en'; // ஆங்கில மொழிக்கு மாற்று
  }

  let finalNotes = text;
  if (currentLanguage === 'en') {
      finalNotes = text + "\n\n(IMPORTANT INSTRUCTION: Reply strictly in English only.)";
  } else if (currentLanguage === 'ta') {
      finalNotes = text + "\n\n(IMPORTANT INSTRUCTION: Reply strictly in Tamil only.)";
  }

  const payload = {
    notes: finalNotes || 'Analyze this image.',
    think: think,
    isSearching: searching,
    lang: currentLanguage, // தேர்ந்தெடுத்த மொழியை Backend-க்கு அனுப்பு
    history: currentMessages.slice(-10)
  };
  
  if(imgData){
    payload.image = imgData.split(',')[1];
    payload.mimeType = imgData.match(/data:(.*?);/)[1];
  }

  const aiRow = document.createElement('div'); aiRow.className = 'message ai'; aiRow.id = 'streamMsg';
  const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = '✳';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const content = document.createElement('div'); content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  bubble.appendChild(content); aiRow.append(avatar, bubble); chat.appendChild(aiRow);
  const main = $('chatArea'); main.scrollTop = main.scrollHeight;

  let full = '';
  abortController = new AbortController();

  try{
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: abortController.signal
    });
    if(!res.ok) throw new Error(`Server error (${res.status})`);

    const data = await res.json();
    full = data.answer || data.summary || data.response || data.text || 'No response received.';
    
    let i = 0;
    content.innerHTML = '';
    function typeWriter() {
        if (i < full.length) {
            content.innerHTML = renderMarkdown(full.substring(0, i + 1));
            main.scrollTop = main.scrollHeight;
            i += 2; 
            setTimeout(typeWriter, 10);
        } else {
            content.innerHTML = renderMarkdown(full);
            
            const tools = document.createElement('div'); tools.className = 'msg-tools';
            const copy = document.createElement('button'); copy.className='tool-btn'; 
            copy.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>Copy</span>';
            copy.onclick = () => { 
                navigator.clipboard?.writeText(full); 
                const span = copy.querySelector('span');
                span.textContent = 'Copied!'; 
                copy.style.color = 'green'; 
                setTimeout(()=>{ span.textContent = 'Copy'; copy.style.color = 'var(--muted)'; }, 1500); 
            };
            
            const speak = createSpeakBtn(full);
            tools.appendChild(copy); tools.appendChild(speak); bubble.appendChild(tools);
            
            currentMessages.push({ role: 'ai', text: full });
            saveHistory();
            
            busy = false; 
            sendBtn.classList.remove('stop-state');
            sendIcon.innerHTML = '<path d="M12 19V5M5 12l7-7 7 7"/>'; 
        }
    }
    typeWriter();

  }catch(err){
    aiRow.remove();
    busy = false; 
    sendBtn.classList.remove('stop-state');
    sendIcon.innerHTML = '<path d="M12 19V5M5 12l7-7 7 7"/>';
    if(err.name !== 'AbortError'){
      addMessage('ai', 'Error: ' + (err.message || 'Connection failed'));
    }
  }
}

sendBtn.onclick = send;

promptBox.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});

promptBox.addEventListener('keydown', e => { 
    if(e.key==='Enter' && !e.shiftKey){ 
        e.preventDefault(); 
        send(); 
    } 
});

$('newBtn').onclick = () => {
  if(currentMessages.length) saveHistory();
  currentMessages = []; currentChatId = null; currentLanguage = 'en'; 
  chat.innerHTML = ''; welcomeScreen.style.display = 'flex'; promptBox.focus();
};

$('menuBtn').onclick = () => $('drawerOverlay').classList.add('show');
$('closeDrawer').onclick = () => $('drawerOverlay').classList.remove('show');
$('drawerOverlay').onclick = (e) => { if(e.target === $('drawerOverlay')) $('drawerOverlay').classList.remove('show'); };

$('voiceBtn').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice not supported'); return; }
  if(recognition){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = currentLanguage === 'ta' ? 'ta-IN' : 'en-US'; 
  recognition.interimResults = false;
  recognition.onresult = e => { promptBox.value += e.results[0][0].transcript; promptBox.dispatchEvent(new Event('input')); };
  recognition.onend = () => recognition = null;
  recognition.start();
  $('voiceBtn').style.color = 'red';
  recognition.onend = () => { recognition = null; $('voiceBtn').style.color = 'var(--text)'; };
};

renderHistory();
})();
</script>
</body>
</html>
