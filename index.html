<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Zyra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #FFFFFF; --text: #000000; --text-light: #666666; --surface: #F4F4F4; --accent: #FF6B2C; --blue: #E8F0FE; --blue-text: #1A73E8; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 0; height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; display: flex; flex-direction: column; overflow: hidden; }

/* Center View */
.center-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.center-view h1 { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 44px; font-weight: 400; margin: 0 0 8px 0; }
.center-view p { color: var(--text-light); font-size: 15px; margin: 0; }
html[lang="ta"] .center-view h1 { font-family: 'Noto Serif Tamil', serif; font-size: 38px; }

/* Chat Area */
.chat-area { display: none; flex: 1; overflow-y: auto; padding: 20px 16px; flex-direction: column; }
.chat-area.active { display: flex; }
.msg-user { align-self: flex-end; background: var(--surface); padding: 12px 18px; border-radius: 20px; max-width: 85%; margin-bottom: 24px; font-size: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg-user img { max-width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; }
.msg-ai { align-self: flex-start; width: 100%; margin-bottom: 30px; line-height: 1.6; font-size: 16px; }
.msg-ai h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin: 20px 0 6px; }
.msg-ai h3:first-child { margin-top: 0; }
.msg-ai p { margin: 0 0 12px; }

/* Bottom Bar */
.bottom-bar { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: #FFFFFF; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E5E5E5; }
.input-container { display: flex; flex-direction: column; background: var(--surface); border-radius: 24px; padding: 10px 14px; gap: 8px; }
.top-tools { display: flex; gap: 8px; align-items: center; }
.tool-btn { display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--text-light); cursor: pointer; font-weight: 500; }
.tool-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.tool-btn.active { background: var(--blue); color: var(--blue-text); border-color: var(--blue); }

/* Image Preview */
.image-preview { display: none; padding: 6px; background: #FFF; border-radius: 10px; border: 1px solid #E5E5E5; margin-bottom: 4px; position: relative; width: fit-content; }
.image-preview img { height: 50px; border-radius: 6px; display: block; }
.image-preview .remove-img { position: absolute; top: -6px; right: -6px; background: #FF6B2C; color: #FFF; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }

.textarea-row { display: flex; align-items: flex-end; gap: 8px; }
textarea { flex: 1; border: none; background: transparent; padding: 6px 0; font-size: 16px; resize: none; max-height: 100px; outline: none; font-family: inherit; line-height: 1.4; color: var(--text); }
textarea::placeholder { color: var(--text-light); }
.action-row { display: flex; align-items: center; gap: 10px; }
.icon-btn { background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); padding: 4px; }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.send-btn { background: var(--text); color: #FFF; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: auto; }
.send-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; }

.loader { display: flex; gap: 4px; align-items: center; color: var(--text-light); font-size: 14px; padding: 10px 0; }
.dot { width: 5px; height: 5px; background: var(--text-light); border-radius: 50%; animation: pulse 1s infinite alternate; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { to { opacity: 0.2; transform: translateY(-3px); } }
</style>
</head>
<body>

<div class="center-view" id="centerView">
  <h1 id="tagline">மனதில் ஒரு பொறி.</h1>
  <p id="intro">உங்கள் எண்ணங்களைத் தெளிவாக்குங்கள்.</p>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="bottom-bar">
  <div class="input-container">
    
    <div class="image-preview" id="imagePreview">
      <img id="previewImg" src="" alt="preview">
      <div class="remove-img" onclick="removeImage()">×</div>
    </div>

    <div class="top-tools">
      <button class="tool-btn" id="thinkBtn" onclick="toggleTool('think')">
        <svg viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg> Think
      </button>
      <button class="tool-btn" id="searchBtn" onclick="toggleTool('search')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Search
      </button>
    </div>

    <div class="textarea-row">
      <textarea id="notes" rows="1" placeholder="Message Zyra..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
    </div>

    <div class="action-row">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" hidden>
      
      <button class="icon-btn" id="micBtn" onclick="startVoice()">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>

      <button class="send-btn" id="sendBtn" onclick="spark()">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let selectedImage = null, selectedMime = null;
let isThinking = false, isSearching = false;
let chatHistory = [];
let userScrolledUp = false;

function toggleTool(tool) {
  if (tool === 'think') { isThinking = !isThinking; $('thinkBtn').classList.toggle('active', isThinking); }
  else if (tool === 'search') { isSearching = !isSearching; $('searchBtn').classList.toggle('active', isSearching); if(isSearching) alert("Search feature coming soon!"); }
}

function startVoice() {
  if (!('webkitSpeechRecognition' in window)) { alert("Voice not supported."); return; }
  const recognition = new webkitSpeechRecognition();
  recognition.lang = 'ta-IN';
  recognition.interimResults = false;
  $('micBtn').style.color = 'red';
  recognition.onresult = function(event) { $('notes').value += event.results[0][0].transcript + " "; $('micBtn').style.color = 'var(--text)'; };
  recognition.onerror = function() { $('micBtn').style.color = 'var(--text)'; };
  recognition.onend = function() { $('micBtn').style.color = 'var(--text)'; };
  recognition.start();
}

function handleImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    selectedImage = e.target.result.split(',')[1];
    selectedMime = file.type;
    $('previewImg').src = e.target.result;
    $('imagePreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  selectedImage = null; selectedMime = null;
  $('imagePreview').style.display = 'none';
  $('fileInput').value = '';
}

function esc(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

function scrollToBottom() {
  if (!userScrolledUp) {
    const chat = $('chatArea');
    setTimeout(() => { chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }); }, 50);
  }
}

$('chatArea').addEventListener('scroll', function() {
  const chat = this;
  const isAtBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100;
  userScrolledUp = !isAtBottom;
});

async function spark() {
  const notes = $('notes').value.trim();
  if (!notes && !selectedImage) return;
  
  userScrolledUp = false; 
  $('centerView').style.display = 'none';
  $('chatArea').classList.add('active');
  const chat = $('chatArea');
  const sendBtn = $('sendBtn');
  sendBtn.disabled = true;
  
  chatHistory.push({ role: "user", text: notes });

  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  if (selectedImage) {
    const img = document.createElement('img');
    img.src = `data:${selectedMime};base64,${selectedImage}`;
    userMsg.appendChild(img);
  }
  if (notes) {
    const textNode = document.createElement('span');
    textNode.textContent = notes;
    userMsg.appendChild(textNode);
  }
  chat.appendChild(userMsg);
  scrollToBottom();

  const loaderMsg = document.createElement('div');
  loaderMsg.className = 'msg-ai';
  loaderMsg.innerHTML = '<div class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  chat.appendChild(loaderMsg);
  scrollToBottom();

  try {
    const payload = { notes, mode: 'ask', lang: 'auto', think: isThinking, history: chatHistory.slice(0, -1) };
    if (selectedImage) { payload.image = selectedImage; payload.mimeType = selectedMime; }

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000); 

    const res = await fetch('/api/summarize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    const data = await res.json();
    
    if (!res.ok) throw new Error(data.error || 'ERROR');
    
    const aiText = data.answer || data.summary || "பதில் கிடைக்கவில்லை.";
    chatHistory.push({ role: "model", text: aiText });

    chat.removeChild(loaderMsg);
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg-ai';
    aiMsg.innerHTML = `<h3>பதில்</h3><p>${esc(aiText)}</p>`;
    chat.appendChild(aiMsg);

  } catch (e) {
    chat.removeChild(loaderMsg);
    const errMsg = document.createElement('div');
    errMsg.className = 'msg-ai';
    let errText = e.name === 'AbortError' ? "பதில் வர அதிக நேரம் எடுக்கிறது." : e.message;
    errMsg.innerHTML = `<p style="color:#FF6B2C; font-weight:500; padding:12px; background:#FFF0E5; border-radius:12px;">${errText}</p>`;
    chat.appendChild(errMsg);
  } finally {
    sendBtn.disabled = false;
    $('notes').value = ''; $('notes').style.height = '';
    removeImage(); 
    scrollToBottom();
  }
}
</script>
</body>
</html>
